type Collection {
  id: ID!
  name: String!
  slug: String!
  createdAt: String!
  documents: [Document!]!
}

type Document {
  id: ID!
  title: String!
  content: String!
  tags: [String!]!
  isArchived: Boolean!
  createdAt: String!
  collectionId: ID!
  collection: Collection!
}

type DocumentConnection {
  items: [Document!]!
  nextCursor: ID
}

type Query {
  collections: [Collection!]!
  collection(id: ID!): Collection
  documents(
    collectionId: ID
    search: String
    isArchived: Boolean
    take: Int
    cursor: ID
  ): DocumentConnection!
}

type Mutation {
  createCollection(name: String!, slug: String!): Collection!
  createDocument(
    title: String!
    content: String!
    collectionId: ID!
    tags: [String!]
  ): Document!
  updateDocument(
    id: ID!
    title: String
    content: String
    tags: [String!]
    isArchived: Boolean
  ): Document!
  deleteDocument(id: ID!): Boolean!
  moveDocument(id: ID!, collectionId: ID!): Document!
}